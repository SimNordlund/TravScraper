name: Run scraper on Fly

on:
  schedule:
    # GitHub cron is UTC.
    # Swedish summer time: 09:00 and 23:00 Europe/Stockholm.
    # Swedish winter time: change to "0 8,22 * * *"
    - cron: "0 7,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-scraper-fly-machine
  cancel-in-progress: false

env:
  FLY_APP_NAME: travscraper
  SCRAPER_IMAGE: docker.io/simonnordlund/travscraper:latest

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run scraper Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          run_output="$(flyctl machine run "$SCRAPER_IMAGE" \
            --app "$FLY_APP_NAME" \
            --region arn \
            --rm \
            --restart no \
            --vm-memory 2048 \
            --vm-cpus 2 \
            --detach)"

          echo "$run_output"

          machine_id="$(echo "$run_output" | awk '/Machine ID:/ {print $3; exit}')"
          if [ -z "$machine_id" ]; then
            echo "Could not find Machine ID in flyctl output" >&2
            exit 1
          fi

          flyctl machine wait "$machine_id" \
            --app "$FLY_APP_NAME" \
            --state started \
            --wait-timeout 5m
